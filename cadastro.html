<div class="auth-shell"><aside class="auth-art"><div class="brand"><img src="assets/images/logo.png"><span>FluxoLegal</span></div><div class="auth-quote">Cadastre sua OAB e deixe a plataforma preparar sua carteira.</div><div class="muted">Seus processos em movimento.</div></aside>
<main class="auth-form-wrap"><div class="auth-form"><a class="btn btn-secondary" href="index.html">← Voltar</a><h1>Crie sua conta</h1><p class="muted">Cadastre seus dados profissionais.</p><form onsubmit="startOnboarding(event)"><div class="form-grid"><div class="field full"><label>Nome completo</label><input required value="Mariana Almeida"></div><div class="field"><label>CPF</label><input required value="123.456.789-00"></div><div class="field"><label>E-mail</label><input type="email" required value="mariana@almeida.adv.br"></div><div class="field"><label>OAB</label><input required value="12345"></div><div class="field"><label>UF</label><select><option>DF</option><option>SP</option><option>MG</option><option>GO</option><option>TO</option></select></div><div class="field"><label>Senha</label><input type="password" required value="12345678"></div><div class="field"><label>Confirmar senha</label><input type="password" required value="12345678"></div></div><button class="btn btn-primary" style="width:100%">Criar conta e sincronizar OAB</button></form><p class="muted" style="text-align:center">Já possui conta? <a href="login.html" style="color:var(--brand)">Entrar</a></p></div></main></div><script src="assets/js/app.js"></script></body></html>
